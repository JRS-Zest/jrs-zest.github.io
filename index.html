<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>JRS Links</title>
    <style>
      body { font-family: sans-serif; margin: 32px; background: #f5f7fb; color: #222; }
      .wrap { max-width: 720px; margin: 0 auto; }
      .links { display: grid; gap: 12px; margin-top: 24px; }
      a.card { display: block; padding: 18px 20px; border-radius: 12px; background: white; border: 1px solid #d9e2f2; text-decoration: none; color: #1b2b4b; font-weight: 700; font-size: 18px; }
      a.card small { display: block; margin-top: 6px; font-weight: 400; color: #667; }
      a.card:hover { border-color: #4a90e2; box-shadow: 0 6px 20px rgba(74,144,226,0.12); }
      .updates { margin-top: 16px; background: #fff7fa; border: 1px solid #f1dbe4; border-radius: 12px; padding: 14px 16px; }
      .updates h2 { margin: 0 0 10px; font-size: 18px; color: #1b2b4b; }
      .updates ul { margin: 0; padding-left: 20px; }
      .updates li { margin: 7px 0; line-height: 1.45; color: #24344f; }
      .updates .date { font-weight: 700; color: #17325c; }
      .updates details { margin-top: 6px; }
      .updates summary { cursor: pointer; font-weight: 700; color: #1b2b4b; }
      .updates summary:hover { text-decoration: underline; }
      .updates .hint { margin: 0 0 10px; font-size: 12px; color: #667; }
      .section-divider {
        margin: 16px 4px;
        border-top: 2px dotted #e2d5dd;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>JRS Links</h1>
      <div class="links">
        <a class="card" href="/JRSmonsters/RedStoneEmu/Docs/monster_viewer_bundle/monster_viewer.html">モンスター図鑑
          <small>monster viewer</small>
        </a>
        <a class="card" href="/JRS_item/?v=c0ad65f">アイテムデータ
          <small>JRS_item</small>
        </a>
        <a class="card" href="https://drive.google.com/file/d/1HpSwj0WQjsvkSp_2lnWommKg17BSHYaA/view?usp=sharing">JRSツールCPP配布.zip
          <small>必要なもの全部入り</small>
        </a>
        <a class="card" href="https://drive.google.com/file/d/1EkXwirFmKc6FhBlqgb8z-zCC5vGCKqgz/view?usp=sharing">JRSChatLoggerCPP更新用.zip
          <small>更新があったものだけ</small>
        </a>
      </div>

      <div class="section-divider" aria-hidden="true"></div>

      <section class="updates" aria-label="更新内容">
        <h2>JRSChatLogger 更新内容</h2>
        <p class="hint">この欄は updates.txt から自動読み込みします。</p>
        <div id="updates-latest">読み込み中...</div>
        <details id="updates-older" hidden>
          <summary>4件目以降を表示</summary>
          <div id="updates-older-body"></div>
        </details>
      </section>
    </div>

    <script>
      function escapeHtml(s) {
        return s
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function parseUpdates(text) {
        const lines = text.replace(/\r\n/g, '\n').split('\n');
        const entries = [];
        let current = null;

        for (const rawLine of lines) {
          const line = rawLine.trim();
          const m = line.match(/^更新内容\s+(\d{4}\/\d{2}\/\d{2})$/);

          if (m) {
            if (current) entries.push(current);
            current = { date: m[1], bullets: [] };
            continue;
          }

          if (!current || line.length === 0) continue;

          if (line.startsWith('- ')) {
            current.bullets.push(line.slice(2).trim());
          } else if (current.bullets.length > 0) {
            current.bullets[current.bullets.length - 1] += ' ' + line;
          }
        }

        if (current) entries.push(current);
        return entries.filter(e => e.bullets.length > 0);
      }

      function renderList(entries) {
        if (!entries.length) return '<p>更新内容がありません。</p>';

        const items = entries.map((e) => {
          const summary = e.bullets.join(' / ');
          return `<li><span class="date">${escapeHtml(e.date)}:</span> ${escapeHtml(summary)}</li>`;
        }).join('');

        return `<ul>${items}</ul>`;
      }

      async function loadUpdates() {
        const latestEl = document.getElementById('updates-latest');
        const olderWrap = document.getElementById('updates-older');
        const olderBody = document.getElementById('updates-older-body');

        try {
          const resp = await fetch(`updates.txt?v=${Date.now()}`, { cache: 'no-store' });
          if (!resp.ok) throw new Error(`HTTP ${resp.status}`);

          const text = await resp.text();
          const all = parseUpdates(text);
          const latest = all.slice(0, 3);
          const older = all.slice(3);

          latestEl.innerHTML = renderList(latest);

          if (older.length > 0) {
            olderWrap.hidden = false;
            olderBody.innerHTML = renderList(older);
          }
        } catch (err) {
          latestEl.innerHTML = '<p>更新内容の読み込みに失敗しました。updates.txt を確認してください。</p>';
          console.error('Failed to load updates:', err);
        }
      }

      loadUpdates();
    </script>
  </body>
</html>
