<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>JRS Links</title>
    <style>
      body { font-family: sans-serif; margin: 32px; background: #f5f7fb; color: #222; }
      .wrap { max-width: 720px; margin: 0 auto; }
      .links { display: grid; gap: 12px; margin-top: 24px; }
      a.card { display: block; padding: 18px 20px; border-radius: 12px; background: white; border: 1px solid #d9e2f2; text-decoration: none; color: #1b2b4b; font-weight: 700; font-size: 18px; }
      a.card small { display: block; margin-top: 6px; font-weight: 400; color: #667; }
      a.card:hover { border-color: #4a90e2; box-shadow: 0 6px 20px rgba(74,144,226,0.12); }
      .updates { margin-top: 16px; background: #fff7fa; border: 1px solid #f1dbe4; border-radius: 12px; padding: 14px 16px; }
      .updates h2 { margin: 0 0 10px; font-size: 18px; color: #1b2b4b; }
      .updates ul { margin: 0; padding-left: 20px; }
      .updates li { margin: 7px 0; line-height: 1.45; color: #24344f; }
      .updates .date { font-weight: 700; color: #17325c; }
      .updates details { margin-top: 6px; }
      .updates summary { cursor: pointer; font-weight: 700; color: #1b2b4b; }
      .updates summary:hover { text-decoration: underline; }
      .updates .hint { margin: 0 0 10px; font-size: 12px; color: #667; }
      .section-divider {
        margin: 16px 4px;
        border-top: 2px dotted #e2d5dd;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>JRS Links</h1>
      <div class="links">
        <a class="card" href="https://duwpy101-debug.github.io/JRS_monsters/">ver 0.0548 モンスター図鑑
          <small>GitHub Pages</small>
        </a>
        <a class="card" href="/JRS_item/">ver 0.0548 アイテムデータ
          <small>GitHub Pages</small>
        </a>
        <a class="card" href="https://drive.google.com/file/d/1HpSwj0WQjsvkSp_2lnWommKg17BSHYaA/view?usp=sharing">Ver 0.0555 JRSツールCPP配布.zip
          <small>Google Drive（必要なもの全部入り）</small>
        </a>
        <a class="card" href="https://drive.google.com/file/d/1EkXwirFmKc6FhBlqgb8z-zCC5vGCKqgz/view?usp=sharing">Ver 0.0555 JRSChatLoggerCPP更新用.zip
          <small>Google Drive（更新があったものだけ）</small>
        </a>
      </div>

      <div class="section-divider" aria-hidden="true"></div>

      <section class="updates" aria-label="更新内容">
        <h2>更新内容</h2>
        <div id="updates-latest">読み込み中...</div>
        <details id="updates-older" hidden>
          <summary>4件目以降を表示</summary>
          <div id="updates-older-body"></div>
        </details>
      </section>
    </div>

    <script>
      function escapeHtml(s) {
        return s
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function parseUpdates(text) {
        const lines = text.replace(/\r\n/g, '\n').split('\n');
        const entries = [];
        let current = null;
        lines.forEach(line => {
          const trimmed = line.trim();
          if (trimmed === "") return;
          const dateMatch = trimmed.match(/(\d{4}[\/\-]\d{2}[\/\-]\d{2})/);
          // 「更新内容」で始まる行を日付行とみなす
          if (trimmed.startsWith("更新内容") && dateMatch) {
            if (current) entries.push(current);
            current = { date: dateMatch[1], contents: [] };
          } else if (current) {
            current.contents.push(trimmed);
          }
        });
        if (current) entries.push(current);
        return entries;
      }

      async function loadUpdates() {
        try {
          const response = await fetch('updates.txt');
          if (!response.ok) throw new Error('Failed to load');
          const text = await response.text();
          const entries = parseUpdates(text);

          const latest = document.getElementById('updates-latest');
          const older = document.getElementById('updates-older');
          const olderBody = document.getElementById('updates-older-body');

          let html = '<ul>';
          entries.forEach((e, i) => {
            const contentHtml = `<li><span class="date">${escapeHtml(e.date)}</span><br>${e.contents.map(c => escapeHtml(c)).join('<br>')}</li>`;
            if (i < 3) {
              html += contentHtml;
            } else {
              olderBody.innerHTML += `<ul>${contentHtml}</ul>`;
            }
          });
          html += '</ul>';
          latest.innerHTML = html;
          if (entries.length > 3) older.hidden = false;
        } catch (e) {
          document.getElementById('updates-latest').textContent = '更新情報の読み込みに失敗しました。';
        }
      }

      loadUpdates();
    </script>
  </body>
</html>
